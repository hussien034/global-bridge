<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cmNile" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#053A6D"/>
      <stop offset="60%" stop-color="#07549A"/>
      <stop offset="100%" stop-color="#0A72CE"/>
    </linearGradient>
    <linearGradient id="cmGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D99B00"/>
      <stop offset="60%" stop-color="#F4B400"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <filter id="cmShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#07549A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Icon Squircle -->
  <rect width="120" height="120" rx="28" fill="#10233F"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Centered Compact Mark -->
  <g transform="translate(14, 18)" filter="url(#cmShadow)">
    <!-- Base Nile Horizon -->
    <path d="M 6 74 L 86 74" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Main Bridge Tower Arc -->
    <path d="M 16 74 C 16 38, 30 16, 50 16 C 60 16, 68 24, 72 38" 
          fill="none" stroke="url(#cmNile)" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Secondary Intersecting Span -->
    <path d="M 44 74 C 48 44, 62 26, 80 26 C 85 26, 88 30, 90 36" 
          fill="none" stroke="#94A3B8" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Dynamic Ascending Golden Route -->
    <path d="M 4 64 C 28 61, 44 50, 72 22 L 92 6" 
          fill="none" stroke="url(#cmGold)" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Target Pulse Beacon -->
    <circle cx="92" cy="6" r="5.5" fill="#F4B400"/>
    <circle cx="92" cy="6" r="2.5" fill="#FFFFFF"/>
    
    <!-- Origin Anchor -->
    <circle cx="4" cy="64" r="3" fill="#F4B400"/>
  </g>
</svg>
